# ═══════════════════════════════════════════════════════════════
#  kitty — Rosé Pine · Monaspace Neon · translucent
#  Stock commented reference: kitty.conf.default-backup
# ═══════════════════════════════════════════════════════════════

# ── Font ───────────────────────────────────────────────────────
font_family      MonaspiceNe Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Monaspace ligatures live in ss01–ss08; calt drives texture healing.
font_features MonaspiceNeNFM-Regular    +calt +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08
font_features MonaspiceNeNFM-Bold       +calt +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08
font_features MonaspiceNeNFM-Italic     +calt +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08
font_features MonaspiceNeNFM-BoldItalic +calt +ss01 +ss02 +ss03 +ss04 +ss05 +ss06 +ss07 +ss08

modify_font cell_height 115%
modify_font underline_position 2
modify_font strikethrough_position 2px
disable_ligatures cursor
text_composition_strategy platform

# ── Transparency ───────────────────────────────────────────────
background_opacity     0.85
# Blur off: it recomputes per frame over the whole window and caused scroll lag.
background_blur        0
# Dim inactive splits slightly instead of leaning on opacity alone.
inactive_text_alpha    0.85

# ── Window ─────────────────────────────────────────────────────
window_padding_width       14 16
hide_window_decorations    titlebar-only
window_border_width        1pt
active_border_color        #c4a7e7
inactive_border_color      #26233a
draw_minimal_borders       yes
placement_strategy         center
remember_window_size       no
initial_window_width       1100
initial_window_height      720
confirm_os_window_close    0

# ── Cursor ─────────────────────────────────────────────────────
cursor_shape          block
cursor_blink_interval 0
# Value is MILLISECONDS the cursor must rest before a trail is drawn.
# Low values animate on every TUI redraw; 300ms limits it to real jumps.
cursor_trail          300
cursor_trail_decay    0.10 0.35
cursor_trail_start_threshold 3

# ── Tab bar ────────────────────────────────────────────────────
tab_bar_edge           top
tab_bar_style          powerline
tab_powerline_style    slanted
tab_bar_min_tabs       2
tab_bar_margin_height  6.0 0.0
tab_title_template     "{index}  {title}"
active_tab_font_style  bold
active_tab_foreground  #191724
active_tab_background  #c4a7e7
inactive_tab_foreground #908caa
inactive_tab_background #1f1d2e
tab_bar_background     none

# ── Rendering ──────────────────────────────────────────────────
# Vsync off fixed scrollback lag on this 120Hz ProMotion panel, but it also
# drops tearing protection. repaint_delay must then beat the 8.33ms frame
# time or frames land unevenly -- 6ms gives ~166 FPS of headroom.
sync_to_monitor  no
repaint_delay    6
input_delay      2

# ── Scrollback / bell ──────────────────────────────────────────
# Interactive scrollback is what makes scrolling up cost; keep it modest.
# The deep archive lives in the pager buffer instead -- ctrl+shift+h to browse.
scrollback_lines          5000
scrollback_pager_history_size 64
enable_audio_bell         no
visual_bell_duration      0.0
window_alert_on_bell      yes

# ── URLs / mouse ───────────────────────────────────────────────
url_style           curly
url_color           #9ccfd8
detect_urls         yes
copy_on_select      no
strip_trailing_spaces smart
mouse_hide_wait     3.0

# ── macOS ──────────────────────────────────────────────────────
macos_option_as_alt              yes
macos_titlebar_color             background
macos_quit_when_last_window_closed yes
macos_show_window_title_in       menubar

# ── Shell ──────────────────────────────────────────────────────
shell_integration enabled
allow_remote_control no

# ═══════════════════════════════════════════════════════════════
#  Rosé Pine (main)
# ═══════════════════════════════════════════════════════════════
background            #191724
foreground            #e0def4
selection_background  #403d52
selection_foreground  #e0def4

cursor                #ebbcba
cursor_text_color     #191724

# black
color0  #26233a
color8  #6e6a86
# red / love
color1  #eb6f92
color9  #eb6f92
# green / pine
color2  #31748f
color10 #31748f
# yellow / gold
color3  #f6c177
color11 #f6c177
# blue / foam
color4  #9ccfd8
color12 #9ccfd8
# magenta / iris
color5  #c4a7e7
color13 #c4a7e7
# cyan / rose
color6  #ebbcba
color14 #ebbcba
# white / text
color7  #e0def4
color15 #e0def4

# marks / search
mark1_foreground #191724
mark1_background #eb6f92
mark2_foreground #191724
mark2_background #c4a7e7
mark3_foreground #191724
mark3_background #9ccfd8

# ── Keys ───────────────────────────────────────────────────────
map cmd+shift+plus  change_font_size all +1.0
map cmd+shift+minus change_font_size all -1.0
map cmd+shift+0     change_font_size all 0
# macOS line navigation. kitty swallows cmd keys, so forward Home/End instead.
# SS3 form (^[OH / ^[OF) is what zsh binds, and TUI apps read it as Home/End.
map cmd+left        send_text all \x1bOH
map cmd+right       send_text all \x1bOF

map cmd+shift+d     launch --location=vsplit --cwd=current
map cmd+shift+e     launch --location=hsplit --cwd=current
